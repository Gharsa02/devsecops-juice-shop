name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets_scan:
    name: secrets_scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (avec allowlist documentee)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -v "$PWD/reports:/out" \
            zricethezav/gitleaks:latest detect --source /repo/app --no-git \
            --config /repo/.gitleaks.toml \
            --report-format json --report-path /out/gitleaks.json --exit-code 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/

  scan_dependencies:
    name: scan_dependencies (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer le package-lock
        run: |
          cd app
          npm install --package-lock-only --ignore-scripts
      - name: Trivy fs - BLOQUANT sur CRITICAL
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD/app:/src" -v "$PWD/reports:/out" \
            -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:latest fs /src --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            --format json --output /out/trivy-fs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: reports/

  docker_scan:
    name: docker_scan (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull de l'image
        run: docker pull bkimminich/juice-shop:latest
      - name: Trivy image - BLOQUANT sur CRITICAL
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/out" -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            --format json --output /out/trivy-image.json \
            bkimminich/juice-shop:latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: reports/