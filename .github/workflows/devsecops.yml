name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets_scan:
    name: secrets_scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (avec allowlist documentee)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -v "$PWD/reports:/out" \
            zricethezav/gitleaks:latest detect --source /repo/app --no-git \
            --config /repo/.gitleaks.toml \
            --report-format json --report-path /out/gitleaks.json --exit-code 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/

  scan_dependencies:
    name: scan_dependencies (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer le package-lock
        run: |
          cd app
          npm install --package-lock-only --ignore-scripts
      - name: Trivy fs - BLOQUANT sur CRITICAL
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD/app:/src" -v "$PWD/reports:/out" \
            -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:0.75.0 fs /src --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            --format json --output /out/trivy-fs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: reports/

  docker_scan:
    name: docker_scan (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull de l'image
        run: docker pull bkimminich/juice-shop:latest
      - name: Trivy image - BLOQUANT sur CRITICAL
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/out" -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:0.75.0 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            --format json --output /out/trivy-image.json \
            bkimminich/juice-shop:latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: reports/

  sast:
    name: sast (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OWASP Top 10
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD/app:/src" -v "$PWD/reports:/out" \
            semgrep/semgrep:latest semgrep scan --config p/owasp-top-ten \
            --severity ERROR --json --output /out/semgrep.json /src || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: reports/

  iac_checkov:
    name: iac_checkov (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov - Dockerfile de l'application (non bloquant)
        run: |
          mkdir -p reports/checkov-dockerfile
          docker run --rm -v "$PWD:/src" -v "$PWD/reports:/out" \
            bridgecrew/checkov:latest -d /src/app --framework dockerfile \
            --output cli --output json \
            --output-file-path /out/checkov-dockerfile \
            --soft-fail
      - name: Checkov - workflows GitHub Actions du projet (non bloquant)
        run: |
          mkdir -p reports/checkov-workflows
          docker run --rm -v "$PWD:/src" -v "$PWD/reports:/out" \
            bridgecrew/checkov:latest -d /src/.github --framework github_actions \
            --output cli --output json \
            --output-file-path /out/checkov-workflows \
            --soft-fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: reports/

  tests:
    name: tests (fumee applicatifs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demarrer l'application
        run: |
          docker run -d --name juice -p 3000:3000 bkimminich/juice-shop:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 3
          done
      - name: Tests de fumee
        run: |
          mkdir -p reports
          {
            echo "Page d'accueil :"
            curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3000
            echo "Version de l'application :"
            curl -sf http://localhost:3000/rest/admin/application-version
            echo
            echo "API des challenges :"
            curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/Challenges
          } | tee reports/smoke-tests.txt
      - name: Logs de l'application si echec
        if: failure()
        run: docker logs juice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-report
          path: reports/

  dast:
    name: dast (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer Juice Shop (staging)
        run: |
          docker run -d --name juice -p 3000:3000 bkimminich/juice-shop:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 3
          done
      - name: ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 -r zap.html -J zap.json -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: reports/

  deploy:
    name: deploy (GHCR + staging)
    runs-on: ubuntu-latest
    needs: [secrets_scan, scan_dependencies, docker_scan, sast, iac_checkov, tests, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Connexion au registre GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Publier l'image validee
        env:
          SHA: ${{ github.sha }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/$OWNER/juice-shop"
          docker pull bkimminich/juice-shop:latest
          docker tag bkimminich/juice-shop:latest "$IMG:$SHA"
          docker tag bkimminich/juice-shop:latest "$IMG:staging"
          docker push "$IMG:$SHA"
          docker push "$IMG:staging"
      - name: Deployer en staging et verifier
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker run -d --name staging -p 3000:3000 "ghcr.io/$OWNER/juice-shop:staging"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && { echo "Staging operationnel"; exit 0; }
            sleep 3
          done
          docker logs staging
          exit 1

  notify:
    name: notify (Discord)
    runs-on: ubuntu-latest
    needs: [secrets_scan, scan_dependencies, docker_scan, sast, iac_checkov, tests, dast, deploy]
    if: always()
    steps:
      - name: Notification Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          R_SECRETS: ${{ needs.secrets_scan.result }}
          R_DEPS: ${{ needs.scan_dependencies.result }}
          R_IMAGE: ${{ needs.docker_scan.result }}
          R_SAST: ${{ needs.sast.result }}
          R_IAC: ${{ needs.iac_checkov.result }}
          R_TESTS: ${{ needs.tests.result }}
          R_DAST: ${{ needs.dast.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL absent : notification ignoree"
            exit 0
          fi
          OK=1
          for r in "$R_SECRETS" "$R_DEPS" "$R_IMAGE" "$R_SAST" "$R_IAC" "$R_TESTS" "$R_DAST"; do
            [ "$r" = success ] || OK=0
          done
          # deploy est ignore (skipped) sur les pull requests
          [ "$R_DEPLOY" = success ] || [ "$R_DEPLOY" = skipped ] || OK=0
          if [ "$OK" = 1 ]; then
            TITLE="Pipeline DevSecOps : SUCCES"; COLOR=3066993
          else
            TITLE="Pipeline DevSecOps : ECHEC"; COLOR=15158332
          fi
          DESC=$(printf 'Depot : %s\nAuteur : %s\nCommit : %s\n\nGitleaks : %s\nTrivy dependances : %s\nTrivy image : %s\nSemgrep : %s\nCheckov : %s\nTests : %s\nZAP : %s\nDeploy : %s\n\n%s' \
            "$REPO" "$ACTOR" "${SHA:0:7}" "$R_SECRETS" "$R_DEPS" "$R_IMAGE" "$R_SAST" "$R_IAC" "$R_TESTS" "$R_DAST" "$R_DEPLOY" "$RUN_URL")
          PAYLOAD=$(jq -n --arg t "$TITLE" --arg d "$DESC" --argjson c "$COLOR" \
            '{embeds:[{title:$t,description:$d,color:$c}]}')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

          //

          
