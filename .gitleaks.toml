title = "Config Gitleaks - Juice Shop (application volontairement vulnerable)"

[extend]
useDefault = true

[allowlist]
description = "Faux secrets documentes: fichiers de test et donnees de challenges"
paths = [
  '''test/''',
  '''frontend/src/app/.*\.spec\.ts''',
  '''data/static/users\.yml''',
  '''infrastructure/terraform/''',
  '''terraform/''',
  '''lib/insecurity\.ts''',
  '''routes/login\.ts''',
  '''frontend/src/app/faucet/'''
]